name: CI

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  docker-userspace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Server and client containers, simulated devices
        run: docker compose up --build --abort-on-container-exit --exit-code-from client client

  docker-kernel:
    # Attaches the simulated devices through the runner's real vhci-hcd driver.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Load vhci-hcd
        run: |
          sudo apt-get update
          sudo apt-get install -y "linux-modules-extra-$(uname -r)" || true
          sudo modprobe vhci-hcd
          ls /sys/devices/platform/vhci_hcd.0
      - name: Kernel end-to-end test
        run: docker compose --profile kernel up --build --abort-on-container-exit --exit-code-from kernel-client kernel-client
